name: Notify Telegram Channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要推送的版本号（如 3.10.3，需与 doc/changelog.md 中的标题一致）'
        required: true
        type: string
      dry_run:
        description: '仅预览消息内容，不实际发送'
        required: false
        default: false
        type: boolean

jobs:
  notify:
    name: Send Release Announcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to Telegram Channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHANNEL_ID || '@flyx_notify' }}
        run: |
          ARGS=("${{ inputs.version }}" "${{ github.repository }}" --sha "${{ github.sha }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python3 .github/scripts/notify-telegram.py "${ARGS[@]}"

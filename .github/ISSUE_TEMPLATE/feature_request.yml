name: 功能建议
description: 想要的新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便，在什么场景下用到
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎么做
      description: 你设想的做法，可以附上其他面板或软件的例子、截图
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代办法
      description: 目前是怎么绕过去的（没有可不填）

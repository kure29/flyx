# Legacy defaults let pre-migration upgraders reuse their existing resources.
# New installations write explicit FLYX resource names into .env.
services:
  backend:
    image: ghcr.io/kure29/flyx-panel-backend:${FLYX_VERSION:-${FLUX_VERSION:-latest}}
    container_name: ${PANEL_BACKEND_CONTAINER:-flux-panel-backend}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_PATH: /app/data/gost.db
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      FLYX_WEBAUTHN_ORIGIN: ${FLYX_WEBAUTHN_ORIGIN-${FLVX_WEBAUTHN_ORIGIN:-}}
      FLVX_WEBAUTHN_ORIGIN: ${FLYX_WEBAUTHN_ORIGIN-${FLVX_WEBAUTHN_ORIGIN:-}}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SERVER_ADDR: :6365
      TZ: Asia/Shanghai
      FLYX_VERSION: ${FLYX_VERSION:-${FLUX_VERSION:-dev}}
      FLUX_VERSION: ${FLYX_VERSION:-${FLUX_VERSION:-dev}}
      PANEL_DEPLOY_DIR: /opt/flyx-panel
      PANEL_BACKEND_CONTAINER: ${PANEL_BACKEND_CONTAINER:-flux-panel-backend}
    ports:
      - "${BACKEND_PORT}:6365"
    volumes:
      - sqlite_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/opt/flyx-panel
    networks:
      - gost-network
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:6365/flow/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: ${PANEL_POSTGRES_CONTAINER:-flux-panel-postgres}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flux_panel}
      POSTGRES_USER: ${POSTGRES_USER:-flux_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flux_panel_change_me}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gost-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flux_panel} -d ${POSTGRES_DB:-flux_panel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ghcr.io/kure29/flyx-panel-frontend:${FLYX_VERSION:-${FLUX_VERSION:-latest}}
    container_name: ${PANEL_FRONTEND_CONTAINER:-vite-frontend}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gost-network


volumes:
  sqlite_data:
    name: ${FLYX_SQLITE_VOLUME:-sqlite_data}
    driver: local
  postgres_data:
    name: ${FLYX_POSTGRES_VOLUME:-postgres_data}
    driver: local


networks:
  # Keep this key: Compose stores it in the network's
  # com.docker.compose.network label and refuses to reuse an existing
  # network whose label differs, which breaks every upgrade.
  gost-network:
    name: ${FLYX_NETWORK:-gost-network}
    driver: bridge
    ipam:
      config:
        - subnet: 172.80.0.0/16 

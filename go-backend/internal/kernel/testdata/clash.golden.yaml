mixed-port: 7890
allow-lan: false
mode: "rule"
log-level: "warning"
proxies:
  - name: "东京 Reality"
    type: "vless"
    server: "203.0.113.10"
    port: 443
    udp: true
    uuid: "0b6e4c38-8f0e-4a3e-9d2d-7a1c2b3c4d5e"
    flow: "xtls-rprx-vision"
    network: "tcp"
    tls: true
    servername: "www.example.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "B6N8vBQgk8i3VdwbEOhstCY3StFqqFPtC9_AsrhtHHw"
      short-id: "0123456789abcdef"
      support-x25519mlkem768: true
  - name: "SS"
    type: "ss"
    server: "2001:db8::1"
    port: 8388
    udp: true
    cipher: "2022-blake3-aes-128-gcm"
    password: "AAAAAAAAAAAAAAAAAAAAAA=="
  - name: "CDN"
    type: "vmess"
    server: "cdn.example.com"
    port: 8443
    udp: true
    uuid: "0b6e4c38-8f0e-4a3e-9d2d-7a1c2b3c4d5e"
    alterId: 0
    cipher: "auto"
    network: "ws"
    ws-opts:
      path: "/ws"
      headers:
        Host: "cdn.example.com"
    tls: true
    servername: "cdn.example.com"
    client-fingerprint: "chrome"
  - name: "Trojan"
    type: "trojan"
    server: "203.0.113.10"
    port: 2053
    udp: true
    password: "trojan-secret"
    network: "grpc"
    grpc-opts:
      grpc-service-name: "tun"
    sni: "t.example.com"
    client-fingerprint: "chrome"
    alpn:
      - "h2"
    skip-cert-verify: true
  - name: "东京 Reality #2"
    type: "vless"
    server: "198.51.100.7"
    port: 30001
    udp: true
    uuid: "0b6e4c38-8f0e-4a3e-9d2d-7a1c2b3c4d5e"
    flow: "xtls-rprx-vision"
    network: "tcp"
    tls: true
    servername: "www.example.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "B6N8vBQgk8i3VdwbEOhstCY3StFqqFPtC9_AsrhtHHw"
      short-id: "0123456789abcdef"
      support-x25519mlkem768: true
proxy-groups:
  - name: "节点选择"
    type: "select"
    proxies:
      - "自动选择"
      - "东京 Reality"
      - "SS"
      - "CDN"
      - "Trojan"
      - "东京 Reality #2"
  - name: "自动选择"
    type: "url-test"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "东京 Reality"
      - "SS"
      - "CDN"
      - "Trojan"
      - "东京 Reality #2"
rules:
  - "GEOIP,LAN,DIRECT,no-resolve"
  - "MATCH,节点选择"
